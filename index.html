<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #003399;
            background-image: repeating-linear-gradient(
                45deg,
                #003399,
                #003399 10px,
                #0044aa 10px,
                #0044aa 20px
            );
            font-family: "Times New Roman", Times, serif;
        }

        .page {
            width: 700px;
            min-height: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border: 4px ridge #cccccc;
            box-shadow: 8px 8px 0 #001a66;
            color: black;
        }

        .header {
            margin-bottom: 25px;
            padding: 8px;
            background-color: #000080;
            border: 3px outset #cccccc;
            color: #ffff00;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .content {
            min-height: 650px;
            text-align: left;
            font-size: 18px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            padding-top: 10px;
            border-top: 1px solid #808080;
            color: #666666;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .page {
                width: auto;
                min-height: 90vh;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">
            My Website
        </div>

        <div class="content">
            <!-- Put your text here -->
        </div>

        <div class="footer">
            Best viewed at 1024 × 768
        </div>
    </div>
</body>
</html>
